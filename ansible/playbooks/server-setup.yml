---
- name: Configure Nexvion server
  hosts: local
  become: true
  gather_facts: false

  tasks:
    - name: Ensure required packages are installed
      ansible.builtin.apt:
        name:
          - curl
          - git
          - unzip
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
