apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexvion-ingress
  namespace: nexvion
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexvion-recovered
                port:
                  number: 8080
